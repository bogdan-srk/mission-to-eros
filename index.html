<style>
  :root{--bg:#070b24;--panel:rgba(14,22,58,.92);--line:rgba(140,170,255,.25);--amber:#ffc44d;--cyan:#5ee0ff;--green:#5df29a;--red:#ff6b6b;--text:#eef2ff;--muted:#a9b4dd}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Baloo 2','Nunito','M PLUS Rounded 1c',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;gap:12px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700;font-size:16px;line-height:1.2}
  .chip small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  #hudR{display:flex;gap:8px}
  #event{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-10px);max-width:min(560px,92vw);background:linear-gradient(135deg,#23306f,#14205a);border:2px solid var(--amber);border-radius:18px;padding:10px 18px;font-size:17px;line-height:1.35;opacity:0;transition:.35s;pointer-events:none;text-align:center}
  #event b{color:var(--amber)}
  #event.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #fact{position:fixed;left:16px;bottom:60px;max-width:min(380px,70vw);background:var(--panel);border:2px solid var(--cyan);border-radius:18px;padding:10px 16px;font-size:16px;line-height:1.35;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none}
  .meter{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden;min-width:70px}.meter i{display:block;height:100%;background:var(--cyan);transition:width .2s}
  #fact .t{color:var(--cyan);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  #fact.show{opacity:1;transform:none}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,7,25,.55);backdrop-filter:blur(3px);padding:16px}
  #overlay.show{display:flex}
  #overlay.milestone{align-items:flex-end;background:linear-gradient(to top,rgba(4,7,25,.8),rgba(4,7,25,.1) 60%);backdrop-filter:none;padding-bottom:max(24px,env(safe-area-inset-bottom))}
  #overlay.milestone .card{max-width:560px}
  .card{background:linear-gradient(160deg,#1a2564,#0f1745);border:2px solid var(--line);border-radius:26px;padding:26px 28px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
  .card .kicker{color:var(--amber);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  .card h1{font-size:40px;line-height:1.05;margin:4px 0 10px;font-weight:800}
  .card h2{font-size:28px;line-height:1.1;margin:4px 0 10px;font-weight:800}
  .card p{font-size:18px;line-height:1.45;color:#d9e0ff;margin-bottom:10px}
  .card ul{margin:6px 0 12px 20px;font-size:17px;line-height:1.45;color:#d9e0ff}
  .card .big{font-size:52px;line-height:1;margin-bottom:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  button.b{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:16px;padding:10px 22px;cursor:pointer;background:var(--amber);color:#2a1a00;box-shadow:0 4px 0 #b9831a;transition:transform .1s}
  button.b:active{transform:translateY(3px);box-shadow:0 1px 0 #b9831a}
  button.b.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none;font-size:15px;padding:6px 14px}
  .jump{margin-top:14px;font-size:14px;color:var(--muted)}
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
  #pad.show{display:flex}
  #pad .lr{display:flex;gap:10px}
  #pad button{pointer-events:auto;font:inherit;font-size:28px;font-weight:800;width:72px;height:72px;border-radius:22px;border:2px solid var(--line);background:rgba(20,30,80,.8);color:var(--text);touch-action:none}
  #pad button.thr{width:150px;font-size:22px;background:rgba(255,196,77,.18);border-color:var(--amber);color:var(--amber)}
  #pad button.on{background:var(--amber);color:#2a1a00}
  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;font-size:15px;color:var(--muted);pointer-events:none;display:none;white-space:nowrap}
  #hint.show{display:block}
  #landBtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:none}
  #lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:none;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  #lang.show{display:flex}
  #lang a{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:4px 10px;border-radius:10px}
  #lang a.on{background:var(--amber);color:#2a1a00}
  @media (max-width:640px){.card h1{font-size:32px}.card p{font-size:16px}#pad button{width:64px;height:64px}#pad button.thr{width:130px}.chip{font-size:14px;padding:4px 10px}.chip small{font-size:10px}#hudL{display:none}#hud{padding:10px}#hudR{gap:6px}#event{top:66px;font-size:15px}#hint{font-size:13px;bottom:12px}}
</style>

<body>

<script>
// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, stage = 0, last = performance.now(), paused = true;
const $ = id => document.getElementById(id);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- i18n (?language=ua → Ukrainian, ?language=ja → Japanese, otherwise English) ----------
const LANG = {ua:'ua', ja:'ja', jp:'ja'}[new URLSearchParams(location.search).get('language')] || 'en';
const I18N = {
  en:{
    title:'Mission to Eros', stage:'Stage', factUnlocked:'Fact unlocked!', prepLand:'Prepare to land &rarr;', thrust:'Thrust',
    eros:'Eros', mathilde:'Mathilde', earth:'Earth', launch:'Launch', launchLong:'1996 Launch',
    // stage 1
    s1Card:(touch,n)=>`<div class="kicker">Stage 1 of 3</div><h2>Approach Eros</h2>

    <ul><li>${touch?'<b>Drag your finger</b> to fly':'Fly with the <b>arrow keys</b> — or drag with the mouse'}</li><li>Collect <span style="color:#9ff0ff">&#129514; flasks</span> to speed up — every ${n} also unlock a fact</li><li>Dodge the space rocks</li></ul>`,
    launchBtn:'Launch! 🚀', liftoff:'Liftoff!',
    introPad:"<b>Cape Canaveral, Florida</b> · February 17, 1996<br>A <b>Delta II</b> rocket with NEAR on top is ready to go!",
    introSep:"The rocket did its job! Its stages drop away and the <b>nose cone opens</b>…",
    introGo:"<b>NEAR is free!</b> You're in control now — fly to Eros!",
    facts:[
      "<b>Asteroids</b> are rocky leftovers from when the planets formed, about <b>4.5 billion years</b> ago.",
      "Most asteroids live in the <b>asteroid belt</b> between Mars and Jupiter. Eros is a <b>near-Earth asteroid</b> — its path comes closer to us.",
      "Asteroids aren't round like planets. They're too small for gravity to squeeze them into balls, so they're lumpy!",
      "<b>Eros</b> is shaped a bit like a <b>peanut</b> and is about <b>34 km (21 miles)</b> long — as long as a big city.",
      "NEAR stands for <b>Near Earth Asteroid Rendezvous</b>. It was later named after scientist <b>Gene Shoemaker</b>.",
      "NEAR carried a camera, a laser to measure height, and tools to sniff out what Eros is made of.",
      "Eros is about as dense as the rocks in <b>Earth's crust</b>.",
      "Space is huge! At one point Eros and NEAR were about <b>355 million km</b> from Earth."
    ],
    events:{
      mathilde:{date:"June 27, 1997", title:"Flying past Mathilde",
        msg:"NEAR zoomed past another asteroid called <b>Mathilde</b> and photographed it. It's <b>covered in craters</b> — and lighter than scientists expected, almost like it's full of holes!"},
      earth:{date:"January 23, 1998", title:"Slingshot around Earth",
        msg:"NEAR swung back past <b>Earth</b>. Earth's gravity pulled on the spacecraft and flung it onto a new path toward Eros — like a <b>slingshot</b>, with no fuel needed!"},
      erospass:{date:"December 20, 1998", title:"Uh-oh, engine trouble!",
        msg:"A big engine burn <b>stopped too early</b>, so NEAR flew right past Eros. The team didn't give up — they planned a loop around the Sun and tried again <b>one year later</b>."}
    },
    milestone:'Milestone', continueBtn:'Continue &#9654;',
    hud1:'1 · Approach Eros', hudDate:'Date', hudNextFact:'Next fact', hudFacts:'Facts',
    s1Win:(score,fi)=>`<div class="kicker">February 14, 2000</div><h2>You reached Eros! 🎉</h2>
      <p>NEAR Shoemaker became the <b>first spacecraft ever to orbit an asteroid</b>.</p>
      <p>Look at its shape — Eros is long and lumpy, about <b>34 km</b> from end to end. You collected <b>${score} science flasks</b> and unlocked <b>${fi} fact${fi===1?'':'s'}</b>.</p>`,
    exploreBtn:'Explore Eros &rarr;',
    // stage 2
    spots:{
      psyche:{title:'Psyche Crater',
        text:"This is the <b>biggest crater</b> on Eros — about <b>5 km wide</b>! Long ago, another space rock smashed into Eros here. Craters are like scars that tell us about crashes in space."},
      himeros:{title:'Himeros, the Saddle',
        text:"See how Eros pinches in the middle? This big dip is called <b>Himeros</b>, and it's shaped like a horse's <b>saddle</b>. NEAR would later land just south of it!"},
      boulders:{title:'Boulder Field',
        text:"Eros is sprinkled with <b>boulders</b> — some as big as a house! Many were probably thrown out when big craters formed, then fell back down."},
      ridge:{title:'The Long Ridge',
        text:"A long <b>ridge</b> stretches across the surface. Scientists think it's a giant crack, a clue that Eros is <b>one solid rock</b> and not a loose pile of rubble."},
      pond:{title:'Dust Ponds',
        text:"Some craters have flat, smooth floors called <b>ponds</b>. They're not water — they're filled with super-fine <b>dust</b> that slid down and settled at the bottom."},
      gravity:{title:'Super-Weak Gravity',
        text:"Gravity on Eros is <b>more than 1,000 times weaker</b> than on Earth. A strong jump might send you flying off into space! Also, NEAR found that Eros has <b>no magnetic field</b>."}
    },
    s2Card:`<div class="kicker">Stage 2 of 3</div><h2>Explore the asteroid</h2>

    s2Btn:'Start scanning 🔍', s2Hint:'Tap or click the glowing rings',
    discovery:(n,total,first)=>`Discovery ${n} of ${total}${first?'':' (again)'}`,
    allFound:'All found! Continue &rarr;', keepExploring:'Keep exploring',
    hud2:'2 · Explore Eros', hudDiscoveries:'Discoveries',
    // stage 3
    s3Card:(touch,safe)=>`<div class="kicker">Stage 3 of 3 · February 12, 2001</div><h2>Land on Eros</h2>

    <ul><li>${touch?'Hold <b>&#128293; Thrust</b>':'<b>&#9650;</b> (or Space)'} fires the thruster to slow down</li><li><b>&#9664; &#9654;</b> nudge sideways</li><li>Touch down in the <span style="color:#5df29a"><b>green zone</b></span> slower than <b>${safe} km/h</b></li></ul>

    tryAgain:'Try again ↻', backToStart:'Back to start',
    winCard:k=>`<div class="kicker">February 12, 2001 · Mission complete</div><div class="big">🏅</div><h2>You landed on Eros!</h2>
    <p>Touchdown at <b>${k} km/h</b>. The real NEAR touched down at about <b>6.4 km/h</b> — slower than a jog!</p>
    <ul><li>It was the <b>first spacecraft ever to land on an asteroid</b>.</li>
    <li>It snapped <b>69 close-up photos</b> on the way down.</li>
    <li>Even though it wasn't built to land, it survived and kept sending science for about <b>two weeks</b>.</li></ul>`,
    playAgain:'Play again ↻', landAgain:'Land again',
    zone:'Landing zone · near Himeros', gaugeSpeed:'SPEED',
    // title
    titleCard:`<div class="kicker">A NASA-inspired space adventure</div><h1>Mission to Eros</h1>
    <p>Fly the real <b>NEAR Shoemaker</b> spacecraft to a giant space rock, explore its craters and boulders, and try to <b>land on an asteroid</b> — just like NASA did in 2001!</p>
    <p style="font-size:15px;color:#a9b4dd">3 stages · about 5 minutes · keyboard, mouse or touch<br>🤖 Made with AI assistance — code, translation and art</p>
    <div class="jump">Demo shortcuts: <a href="#" data-j="2" style="color:#5ee0ff">Stage 2</a> · <a href="#" data-j="3" style="color:#5ee0ff">Stage 3</a></div>`,
    startBtn:'Start mission 🚀'
  },
  ua:{
    title:'Місія до Ероса', stage:'Етап', factUnlocked:'Новий факт!', prepLand:'Готуйся до посадки &rarr;', thrust:'Тяга',
    eros:'Ерос', mathilde:'Матильда', earth:'Земля', launch:'Старт', launchLong:'Старт 1996',
    // stage 1
    s1Card:(touch,n)=>`<div class="kicker">Етап 1 з 3</div><h2>Політ до Ероса</h2>
    <p>Ти керуєш космічним апаратом <b>NEAR Shoemaker</b>, запущеним із Землі у 1996 році! Веди його до астероїда <b>Ерос</b>.</p><p>Кожна <b>наукова колба</b>, яку ти зловиш, <b>розганяє двигун</b> — що більше збереш, то швидше долетиш!</p>
    <ul><li>${touch?'<b>Веди пальцем</b>, щоб керувати':'Керуй <b>стрілками</b> — або веди мишкою'}</li><li>Збирай <span style="color:#9ff0ff">&#129514; колби</span>, щоб пришвидшитися — кожні ${n} відкривають факт</li><li>Ухиляйся від космічних каменів</li></ul>`,
    launchBtn:'Старт! 🚀', liftoff:'Пуск!',

    facts:[
      "<b>Астероїди</b> — це кам'яні залишки з часів, коли формувалися планети, приблизно <b>4,5 мільярда років</b> тому.",

// ---------- analytics (GoatCounter: cookieless, no consent banner; skips localhost) ----------
const GOATCOUNTER = 'srk-bogdan'; // your site code, e.g. 'mission-to-eros' → https://mission-to-eros.goatcounter.com
function track(name){ try{ window.goatcounter?.count?.({path:`${LANG}/${name}`, title:name, event:true}); }catch(e){} }
if(GOATCOUNTER){
  const s=document.createElement('script'); s.async=true; s.src='https://gc.zgo.at/count.js';
  s.dataset.goatcounter=`https://${GOATCOUNTER}.goatcounter.com/count`; s.onload=()=>track('open');
  document.head.appendChild(s);
}

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

// ---------- input ----------
const keys = {up:false,down:false,left:false,right:false};
const keymap = {ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown', e=>{ if(keymap[e.code]){keys[keymap[e.code]]=true; e.preventDefault();} });
addEventListener('keyup', e=>{ if(keymap[e.code]) keys[keymap[e.code]]=false; });
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');audioInit();};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
});
const isTouch = matchMedia('(pointer:coarse)').matches;
// iOS: stop long-press text selection, magnifier, callout menu and double-tap zoom
const noTouchDefault = e => { if(e.touches && e.touches.length>1) return; e.preventDefault(); };
cv.addEventListener('touchstart', noTouchDefault, {passive:false});
cv.addEventListener('touchmove', noTouchDefault, {passive:false});
$('pad').addEventListener('touchstart', noTouchDefault, {passive:false});
$('pad').addEventListener('touchmove', noTouchDefault, {passive:false});
['selectstart','contextmenu','dragstart'].forEach(n=>document.addEventListener(n, e=>e.preventDefault()));
document.addEventListener('gesturestart', e=>e.preventDefault());

// ---------- audio ----------
let AC=null, thrustGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const len = AC.sampleRate*1, buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src = AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    thrustGain = AC.createGain(); thrustGain.gain.value=0;
    src.connect(f); f.connect(thrustGain); thrustGain.connect(AC.destination); src.start();
  }catch(e){AC=null}
}
function beep(freq=660,dur=.12,type='sine',vol=.12){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function chime(){beep(660,.12);setTimeout(()=>beep(990,.18),90)}
function setThrust(v){ if(thrustGain) thrustGain.gain.setTargetAtTime(v?0.18:0, AC.currentTime, .05); }

const SR = rng(7), STARS = Array.from({length:260},()=>({x:SR(),y:SR(),z:.2+SR()*.8,tw:SR()*6.28}));
function drawStars(dx=0, t=0){
  for(const s of STARS){
    let x = ((s.x - dx*s.z)%1+1)%1 * W, y = s.y*H;
    const a = .35 + .65*s.z*(.75+.25*Math.sin(t*2+s.tw));

function bg(){
  const g=ctx.createRadialGradient(W*.7,H*.3,0,W*.5,H*.5,Math.max(W,H));

// ---------- Eros model (normalized: length 2, x in [-1,1]) ----------
const EROS = (()=>{
  const r = rng(433);
  const N=180, pts=[];
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, x=Math.cos(a);
    let y=Math.sin(a)*0.42*(1-0.36*Math.exp(-(x*x)/0.07));
    const n=1+0.03*Math.sin(5*a+1)+0.018*Math.sin(11*a+2)+0.012*Math.sin(19*a+.5);
    pts.push([x*n, y*n]);
  }
  const hh = x => 0.42*Math.sqrt(Math.max(0,1-x*x))*(1-0.36*Math.exp(-(x*x)/0.07));
  const craters=[];
  for(let i=0;i<70;i++){
    const x=-0.92+r()*1.84, lim=hh(x)*0.85, y=(r()*2-1)*lim, rad=0.012+Math.pow(r(),3)*0.06;
    craters.push({x,y,r:rad});
  }
  craters.push({x:-0.45,y:-0.02,r:0.15,big:true});           // Psyche
  craters.push({x:-0.74,y:0.09,r:0.06,pond:true});            // pond crater
  const boulders=[];
  for(let i=0;i<120;i++){
    const x=-0.95+r()*1.9, lim=hh(x)*0.9, y=(r()*2-1)*lim;
    boulders.push({x,y,r:0.003+r()*0.006});
  }
  for(let i=0;i<26;i++){ // a cluster near the boulder hotspot
    boulders.push({x:0.5+(r()-.5)*0.16,y:0.12+(r()-.5)*0.12,r:0.005+r()*0.011});
  }
  return {pts,craters,boulders,hh};
})();

function erosPath(s){
  ctx.beginPath();
  EROS.pts.forEach(([x,y],i)=> i? ctx.lineTo(x*s,y*s) : ctx.moveTo(x*s,y*s));
  ctx.closePath();
}
function drawEros(cx,cy,s,rot=0,detail=true){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  // glow
  if(s>30){ctx.shadowColor='rgba(255,200,140,.25)'; ctx.shadowBlur=s*.15;}
  erosPath(s);
  const g=ctx.createLinearGradient(-s*.6,-s*.5,s*.6,s*.5);
  g.addColorStop(0,'#e3c597'); g.addColorStop(.55,'#a8865f'); g.addColorStop(1,'#4c3a29');
  ctx.fillStyle=g; ctx.fill(); ctx.shadowBlur=0;
  if(detail && s>18){
    ctx.save(); erosPath(s); ctx.clip();
    // ridge (Rahe Dorsum-style long ridge)
    ctx.strokeStyle='rgba(255,236,200,.35)'; ctx.lineWidth=Math.max(1,s*.012);
    ctx.beginPath(); ctx.moveTo(s*0.12,-s*0.26); ctx.quadraticCurveTo(s*0.45,-s*0.2,s*0.82,s*0.06); ctx.stroke();
    ctx.strokeStyle='rgba(40,25,10,.35)'; ctx.lineWidth=Math.max(1,s*.008);
    ctx.beginPath(); ctx.moveTo(s*0.13,-s*0.25+s*.012); ctx.quadraticCurveTo(s*0.46,-s*0.19+s*.012,s*0.83,s*0.07+s*.01); ctx.stroke();
    // craters
    for(const c of EROS.craters){
      const x=c.x*s,y=c.y*s,r=c.r*s; if(r<0.8) continue;
      ctx.fillStyle = c.pond ? 'rgba(190,160,120,.9)' : 'rgba(60,42,26,.45)';
      ctx.beginPath(); ctx.ellipse(x,y,r,r*.9,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,235,200,.35)'; ctx.lineWidth=Math.max(.6,r*.18);
      ctx.beginPath(); ctx.ellipse(x,y,r,r*.9,0,Math.PI*.1,Math.PI*.95); ctx.stroke();
      ctx.strokeStyle='rgba(30,18,8,.45)';
      ctx.beginPath(); ctx.ellipse(x,y,r,r*.9,0,Math.PI*1.1,Math.PI*1.95); ctx.stroke();
      if(c.pond){ctx.fillStyle='rgba(225,200,160,.9)';ctx.beginPath();ctx.ellipse(x,y+r*.15,r*.6,r*.4,0,0,Math.PI*2);ctx.fill();}
    }
    // boulders
    if(s>120) for(const b of EROS.boulders){
      const x=b.x*s,y=b.y*s,r=Math.max(.8,b.r*s);
      ctx.fillStyle='rgba(245,225,190,.8)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(20,12,5,.55)'; ctx.beginPath(); ctx.arc(x+r*.6,y+r*.6,r*.8,0,Math.PI*2); ctx.fill();
    }
    // shading (night side)
    const sh=ctx.createLinearGradient(-s*.3,-s*.3,s*1.0,s*.5);
    sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(.7,'rgba(0,0,10,.25)'); sh.addColorStop(1,'rgba(0,0,10,.7)');
    ctx.fillStyle=sh; ctx.fillRect(-s*1.2,-s,s*2.4,s*2);
    ctx.restore();
  }
  ctx.restore();
}

// ---------- NEAR spacecraft ----------
function drawNEAR(x,y,s,rot=0,flame=0,flameDir='back'){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  // flame
  if(flame>0){
    const fl = s*(0.6+Math.random()*.5)*flame;
    ctx.fillStyle='rgba(255,170,60,.9)';
    ctx.beginPath();
    if(flameDir==='back'){ctx.moveTo(-s*.45,-s*.15);ctx.lineTo(-s*.45-fl,0);ctx.lineTo(-s*.45,s*.15);}
    else {ctx.moveTo(-s*.15,s*.45);ctx.lineTo(0,s*.45+fl);ctx.lineTo(s*.15,s*.45);}
    ctx.fill();
    ctx.fillStyle='rgba(255,240,180,.9)';
    ctx.beginPath();
    if(flameDir==='back'){ctx.moveTo(-s*.45,-s*.07);ctx.lineTo(-s*.45-fl*.5,0);ctx.lineTo(-s*.45,s*.07);}
    else {ctx.moveTo(-s*.07,s*.45);ctx.lineTo(0,s*.45+fl*.5);ctx.lineTo(s*.07,s*.45);}
    ctx.fill();
  }
  // solar panels (4, like NEAR)
  const panel=(px,py,w,h)=>{
    ctx.fillStyle='#1d3f9a'; ctx.fillRect(px,py,w,h);
    ctx.strokeStyle='#6fa0ff'; ctx.lineWidth=Math.max(.6,s*.03); ctx.strokeRect(px,py,w,h);
    ctx.beginPath(); for(let i=1;i<3;i++){ctx.moveTo(px+w*i/3,py);ctx.lineTo(px+w*i/3,py+h);} ctx.stroke();
  };
  ctx.strokeStyle='#bfc6d8'; ctx.lineWidth=Math.max(1,s*.05);
  ctx.beginPath(); ctx.moveTo(-s*1.25,0); ctx.lineTo(s*1.25,0); ctx.moveTo(0,-s*1.25); ctx.lineTo(0,s*1.0); ctx.stroke();
  panel(-s*1.35,-s*.18,s*.85,s*.36); panel(s*.5,-s*.18,s*.85,s*.36);
  panel(-s*.18,-s*1.35,s*.36,s*.85);
  // body (octagon, gold foil)
  ctx.beginPath();
  for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4; ctx.lineTo(Math.cos(a)*s*.5,Math.sin(a)*s*.5);}
  ctx.closePath();
  const g=ctx.createLinearGradient(-s*.5,-s*.5,s*.5,s*.5); g.addColorStop(0,'#ffe08a'); g.addColorStop(1,'#c58a1c');
  ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#7a5208'; ctx.lineWidth=Math.max(.8,s*.04); ctx.stroke();
  // antenna dish
  ctx.fillStyle='#f4f6fb'; ctx.beginPath(); ctx.arc(0,0,s*.26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9cfdd'; ctx.beginPath(); ctx.arc(0,0,s*.07,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawRock(x,y,r,rot,seed,col='#8b8f9c'){
  const R=rng(seed); ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath(); for(let i=0;i<9;i++){const a=i/9*Math.PI*2, rr=r*(.7+R()*.35); ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath();
  ctx.fillStyle=col; ctx.fill(); ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(r*.2,r*.15,r*.25,0,7); ctx.fill();
  ctx.restore();
}
const FLASK_COLORS=['#5ee0ff','#5df29a','#ff7ad9','#b18cff','#ffc44d'];
function drawFlask(x,y,r,t,seed){
  const col=FLASK_COLORS[seed%FLASK_COLORS.length];
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2)*.25);
  const nw=r*.32, nt=-r*1.05, nb=-r*.35, bw=r*.9, bb=r*.85;
  const body=()=>{ctx.beginPath(); ctx.moveTo(-nw,nt); ctx.lineTo(-nw,nb); ctx.lineTo(-bw,bb-r*.12); ctx.quadraticCurveTo(-bw,bb,-bw+r*.15,bb); ctx.lineTo(bw-r*.15,bb); ctx.quadraticCurveTo(bw,bb,bw,bb-r*.12); ctx.lineTo(nw,nb); ctx.lineTo(nw,nt); ctx.closePath();};
  // glow + glass
  ctx.shadowColor=col; ctx.shadowBlur=18;
  body(); ctx.fillStyle='rgba(220,240,255,.18)'; ctx.fill(); ctx.shadowBlur=0;
  // liquid
  ctx.save(); body(); ctx.clip();
  const ly=r*.15+Math.sin(t*4)*r*.05;
  ctx.fillStyle=col; ctx.globalAlpha=.9; ctx.fillRect(-bw,ly,bw*2,bb-ly+2);
  ctx.globalAlpha=1; ctx.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<3;i++){const bt=(t*1.2+i/3)%1; ctx.beginPath(); ctx.arc((i-1)*r*.3, lerp(bb-r*.1,ly,bt), r*.08*(1-bt*.4),0,7); ctx.fill();}
  ctx.restore();
  // outline, rim, shine
  body(); ctx.strokeStyle='rgba(235,248,255,.95)'; ctx.lineWidth=Math.max(1.5,r*.1); ctx.lineJoin='round'; ctx.stroke();
  ctx.fillStyle='rgba(235,248,255,.95)'; ctx.fillRect(-nw*1.35,nt-r*.12,nw*2.7,r*.16);
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=Math.max(1,r*.07); ctx.beginPath(); ctx.moveTo(-bw*.55,bb-r*.25); ctx.lineTo(-nw*.6,nb+r*.05); ctx.stroke();
  ctx.restore();
}

// ---------- launch movie: pad → countdown → ascent → separation → NEAR released ----------
const INTRO = {lift:3, sep:10, open:11.2, free:11.6, end:13.6};
const CLOUDS = (()=>{ const R=rng(17); return Array.from({length:14},()=>({x:R(),alt:260+R()*1100,w:50+R()*110})); })();
const ease = p => p*p*(3-2*p);
const introAlt = t => { const k=Math.max(0,t-INTRO.lift); return 40*k*k; };
function introPose(t){ // rocket centre on screen; cam = how far the ground has scrolled down
  const padY=H*.8, u0=clamp(H*.035,14,30), alt=introAlt(t), rise=Math.min(alt,padY-H*.5);
  const e=ease(clamp((t-INTRO.lift-3.5)/3,0,1)), u=lerp(u0,u0*.7,e);   // pitch over to fly right
  return {x:lerp(W*.5,Math.max(W*.16,4.6*u),e), y:lerp(padY-rise-3.45*u0,H*.48,e), rot:e*Math.PI/2, u, cam:alt-rise, padY, alt};
}
const L2S = (P,lx,ly) => [P.x+(lx*Math.cos(P.rot)-ly*Math.sin(P.rot))*P.u, P.y+(lx*Math.sin(P.rot)+ly*Math.cos(P.rot))*P.u];
function updateIntro(S,dt){
  const I=S.intro; I.t+=dt; const t=I.t, P=introPose(t);
  while(I.beeps<3 && t>=I.beeps){ beep(880,.15,'square',.05); I.beeps++; }
  if(I.beeps===3 && t>=INTRO.lift){ I.beeps++; beep(1320,.35,'sine',.1); setThrust(true); }
  if(!I.sep && t>=INTRO.sep){ I.sep=true; setThrust(false); beep(260,.12,'square',.07); eventMsg(T.introSep,3200); }
  if(!I.open && t>=INTRO.open){ I.open=true; beep(620,.1,'triangle',.07); }
  // steam before liftoff, then exhaust smoke (kept in ground coordinates so it stays behind)
  if(t>1.5 && t<INTRO.lift+2.5 && (t>=INTRO.lift || Math.random()<.3)){
    for(let i=0;i<(t<INTRO.lift?1:3);i++){ const [nx,ny]=L2S(P,(Math.random()-.5)*.8,3.6);
      const pre=t<INTRO.lift;
      I.puffs.push({x:nx,y:ny-P.cam,r:P.u*(.3+Math.random()*.3),vx:(Math.random()-.5)*P.u*(pre?1.5:4),g:pre?.4:1,t:0}); }
  }
  for(const q of I.puffs){ q.t+=dt; q.r+=dt*P.u*q.g; q.x+=q.vx*dt; }
  I.puffs=I.puffs.filter(q=>q.t<3);
  if(t>=INTRO.end){ S.intro=null; drag1=null; eventMsg(T.introGo,4500); chime(); }
}
function rocketFlame(x,y,w,len){
  const L=len*(.85+Math.random()*.3);
  ctx.fillStyle='rgba(255,150,50,.9)'; ctx.beginPath(); ctx.moveTo(x-w,y); ctx.quadraticCurveTo(x-w*.9,y+L*.5,x,y+L); ctx.quadraticCurveTo(x+w*.9,y+L*.5,x+w,y); ctx.fill();
  ctx.fillStyle='rgba(255,240,190,.95)'; ctx.beginPath(); ctx.moveTo(x-w*.5,y); ctx.quadraticCurveTo(x-w*.4,y+L*.3,x,y+L*.55); ctx.quadraticCurveTo(x+w*.4,y+L*.3,x+w*.5,y); ctx.fill();
}
// rocket parts in local units (u), nose pointing up (-y)
function drawLowerStage(f){
  if(f>0){ rocketFlame(0,3.45,.4,3.2*f); rocketFlame(-.75,3.32,.16,1.8*f); rocketFlame(.75,3.32,.16,1.8*f); }
  for(const sx of [-1,1]){ // strap-on boosters
    ctx.fillStyle='#f1f3f7'; ctx.beginPath(); ctx.moveTo(sx*.57,3.1); ctx.lineTo(sx*.57,1); ctx.lineTo(sx*.75,.4); ctx.lineTo(sx*.93,1); ctx.lineTo(sx*.93,3.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#9aa3b5'; ctx.fillRect(sx*.75-.14,3.1,.28,.22);
  }
  const g=ctx.createLinearGradient(-.5,0,.5,0); g.addColorStop(0,'#7fb8c9'); g.addColorStop(.45,'#cfeef6'); g.addColorStop(1,'#5d93a6');
  ctx.fillStyle=g; ctx.fillRect(-.5,-2,1,5.1);
  ctx.fillStyle='#2b4f7a'; ctx.fillRect(-.5,-1.2,1,.18);
  ctx.fillStyle='#4a4f5c'; ctx.beginPath(); ctx.moveTo(-.3,3.1); ctx.lineTo(.3,3.1); ctx.lineTo(.4,3.45); ctx.lineTo(-.4,3.45); ctx.closePath(); ctx.fill();
}
function drawUpperStage(f){

  ctx.fillStyle='#4a4f5c'; ctx.beginPath(); ctx.moveTo(-.18,-2); ctx.lineTo(.18,-2); ctx.lineTo(.26,-1.7); ctx.lineTo(-.26,-1.7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e9ecf2'; ctx.fillRect(-.42,-3.2,.84,1.2);

function drawFairing(side){
  ctx.beginPath(); ctx.moveTo(0,-3.2); ctx.lineTo(side*.55,-3.2); ctx.lineTo(side*.55,-4.3); ctx.quadraticCurveTo(side*.55,-5.1,0,-5.4); ctx.closePath();
  ctx.fillStyle='#f7f8fb'; ctx.fill(); ctx.strokeStyle='#b9c0cf'; ctx.lineWidth=.04; ctx.stroke();
}
function drawIntro(t){
  const I=s1.intro, it=I.t, P=introPose(it), u=P.u, k=clamp((P.alt-200)/1600,0,1);
  // sky fades from blue to space
  bg();
  ctx.globalAlpha=k; drawStars((it-INTRO.end)*.02,t); ctx.globalAlpha=1;
  if(k<1){ const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#2f6fc4'); sky.addColorStop(1,'#a9d8ff');
    ctx.globalAlpha=1-k; ctx.fillStyle=sky; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  // Earth seen from orbit, sinking away
  const ea=clamp((P.alt-1100)/600,0,1), eh=H*.24*(1-clamp((it-8.5)/3.5,0,1));
  if(ea>0 && eh>0){ const R=Math.max(W,H)*1.6, cx=W*.4, cy=H-eh+R;
    ctx.globalAlpha=ea;
    const g=ctx.createLinearGradient(0,H-eh,0,H); g.addColorStop(0,'#5fb0ff'); g.addColorStop(1,'#123f8f');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    ctx.strokeStyle='rgba(140,200,255,.55)'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(cx,cy,R+4,0,7); ctx.stroke();
    ctx.fillStyle='rgba(80,170,90,.7)'; ctx.beginPath(); ctx.ellipse(W*.62,H-eh*.45,W*.12,eh*.22,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(W*.3,H-eh*.6,W*.1,eh*.1,.1,0,7); ctx.fill();
    ctx.globalAlpha=1; }
  // launch site
  const gy=P.padY+P.cam;
  if(gy-H*.08<H){
    const hz=gy-H*.07, land=gy-H*.025;
    ctx.fillStyle='#2c6aa3'; ctx.fillRect(0,hz,W,land-hz);
    ctx.fillStyle='#5b6f86'; ctx.fillRect(W*.75,hz-H*.07,W*.06,H*.07); ctx.fillRect(W*.83,hz-H*.03,W*.04,H*.03); ctx.fillRect(W*.1,hz-H*.025,W*.05,H*.025);
    const lg=ctx.createLinearGradient(0,land,0,H); lg.addColorStop(0,'#6e9a57'); lg.addColorStop(1,'#3b5a2e');
    ctx.fillStyle=lg; ctx.fillRect(0,land,W,Math.max(0,H-land));
    ctx.fillStyle='#8d9096'; ctx.fillRect(W*.5-2.5*u,gy-.15*u,5*u,.6*u);
    // service tower
    const tx=W*.5-2.6*u, top=gy-9.5*u;
    ctx.strokeStyle='#c7553a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(tx,gy); ctx.lineTo(tx,top); ctx.moveTo(tx+u,gy); ctx.lineTo(tx+u,top);
    for(let y=gy;y>top;y-=u){ ctx.moveTo(tx,y); ctx.lineTo(tx+u,y-u); ctx.moveTo(tx+u,y); ctx.lineTo(tx,y-u); }
    ctx.stroke();
    ctx.fillStyle='#c7553a'; ctx.fillRect(tx+u,gy-7.6*u,W*.5-.6*u-(tx+u),.3*u);

const S1_EVENTS = [

  {t:43, kind:"erospass", dur:6, show:.5, icon:"⚠️"}

const TIME_RATE = 0.33;   // mission clock speed on its own (slow)

function yearAt(t){ // map game time to mission date for timeline

  for(let i=1;i<k.length;i++) if(t<=k[i][0]) return lerp(k[i-1][1],k[i][1],(t-k[i-1][0])/(k[i][0]-k[i-1][0]));

}
function updateStage1(dt){

  S.vy+=ay*1500*dt; S.vx+=ax*900*dt; S.vy*=Math.pow(.02,dt); S.vx*=Math.pow(.02,dt);

  for(const f of S.fly) if(!f.shown){ S.t=Math.min(S.t,f.e.t); S.boost=0; }
  { const nxt=S1_EVENTS.find(e=>!S.events.has(e.t)); if(nxt && S.fly.length) S.t=Math.min(S.t,nxt.t); }
  for(const f of S.fly){
    f.k+=dt/f.e.dur;
    if(!f.shown && f.k>=f.e.show){
      f.shown=true; S.boost=0; drag1=null; for(const k in keys) keys[k]=false; beep(440,.15,'triangle',.08);

}

const SPOTS = [

  {id:'himeros', x:0.03,y:-0.2, icon:'🐴'},
  {id:'boulders', x:0.5,y:0.12, icon:'🪨'},
  {id:'ridge', x:0.5,y:-0.17, icon:'⛰️'},

  {id:'gravity', x:-0.12,y:0.2, icon:'🪶'}

let s2;
// Fit Eros into the free area between the HUD (top) and hint (bottom).
// On tall / portrait screens, stand Eros upright so it fills the space.
function erosFrame(){
  const top=84, bottom=64, aw=W-24, ah=Math.max(120,H-top-bottom);
  const portrait = ah > aw*1.05;
  // Eros is 2s long and ~0.9s thick (incl. ring padding)

  return {cx:W/2, cy:top+ah/2, s, rot: portrait?Math.PI/2:0, portrait};
}
function startStage2(){
  stage=2; clearMsgs(); $('pad').classList.remove('show'); track('stage2');
  s2={t:0,found:new Set(),hover:null};

}
function spotXY(sp){ const f=erosFrame(); return f.portrait ? [f.cx-sp.y*f.s, f.cy+sp.x*f.s] : [f.cx+sp.x*f.s, f.cy+sp.y*f.s]; }

cv.addEventListener('pointerdown',e=>{

    [{label: n===SPOTS.length && first ? T.allFound : T.keepExploring, fn:()=>{ if(n===SPOTS.length){ $('landBtn').style.display='block'; hint(null);} }}]);
});
function pickSpot(mx,my){
  let best=null,bd=1e9; for(const sp of SPOTS){const [x,y]=spotXY(sp); const d=Math.hypot(mx-x,my-y); if(d<spotR()*1.6&&d<bd){bd=d;best=sp;}} return best;

const WORLD_W=420, START_ALT=250, G=0.22, THRUST=0.6, SIDE=0.28, SAFE_KMH=7.5;
let s3, TER;
function buildTerrain(){
  const R=rng(2001), pts=[], zone={x0:250,x1:296};
  const n1=R()*6, n2=R()*6;
  for(let x=0;x<=WORLD_W;x+=2){
    let h=30+10*Math.sin(x/37+n1)+6*Math.sin(x/13+n2)+3*Math.sin(x/5.3);
    const dz = x<zone.x0 ? zone.x0-x : x>zone.x1 ? x-zone.x1 : 0;
    const k = clamp(dz/30,0,1); h = lerp(22,h,k*k*(3-2*k));
    pts.push(h);
  }
  // blend edges
  const boulders=[];
  for(let i=0;i<40;i++){const x=R()*WORLD_W; if(x>zone.x0-8&&x<zone.x1+8) continue; boulders.push({x,r:1.5+R()*5});}
  TER={pts,zone,boulders};
}
function terH(x){ const i=clamp(x/2,0,TER.pts.length-1), a=Math.floor(i), b=Math.min(a+1,TER.pts.length-1); return lerp(TER.pts[a],TER.pts[b],i-a); }
function startStage3(){
  stage=3; clearMsgs(); hint(null); buildTerrain(); track('stage3');
  $('pad').classList.toggle('show', isTouch);
  s3={x:70,y:START_ALT,vx:2.2,vy:-2.5,fuel:100,state:'fly',t:0,photos:0,lastPhoto:0,flash:0,thrust:false};
  showCard(T.s3Card(isTouch,num(SAFE_KMH,1)), [{label:T.s3Btn}]);
}
function updateStage3(dt){
  const S=s3; if(S.state!=='fly') return;
  S.t+=dt;
  let ay=-G, ax=0, burn=false;
  if(S.fuel>0){
    if(keys.up){ay+=THRUST; S.fuel-=2.4*dt; burn=true;}
    if(keys.left){ax-=SIDE; S.fuel-=1.1*dt; burn=true;}
    if(keys.right){ax+=SIDE; S.fuel-=1.1*dt; burn=true;}
    S.fuel=Math.max(0,S.fuel);
  }
  S.thrust=keys.up&&S.fuel>0; setThrust(burn);
  S.vy+=ay*dt; S.vx+=ax*dt; S.vx*=Math.pow(.97,dt);
  S.x+=S.vx*dt; S.y+=S.vy*dt;
  if(S.x<5){S.x=5;S.vx=Math.abs(S.vx)*.3} if(S.x>WORLD_W-5){S.x=WORLD_W-5;S.vx=-Math.abs(S.vx)*.3}
  if(S.y>START_ALT+60){S.y=START_ALT+60;S.vy=Math.min(S.vy,0)}
  // photos during descent (NEAR took 69!)
  const target=Math.floor(69*clamp(1-(S.y-terH(S.x))/(START_ALT-25),0,1));
  if(target>S.photos){S.photos=target; S.flash=.15; if(S.photos%5===0) beep(1400,.04,'square',.04);}
  if(S.flash>0) S.flash-=dt;
  const alt=S.y-4-terH(S.x), spd=Math.hypot(S.vx,S.vy), kmh=spd*3.6;
  const col = kmh<=SAFE_KMH?'#5df29a':kmh<=15?'#ffc44d':'#ff6b6b';
  setHUD(T.hud3,
    `<div class="chip"><small>${T.hudSpeed}</small><span style="color:${col}">${num(kmh,1)} ${T.kmh}</span></div>
     <div class="chip"><small>${T.hudAlt}</small>${Math.max(0,alt).toFixed(0)} ${T.m}</div>
     <div class="chip"><small>${T.hudFuel}</small><span style="color:${S.fuel<20?'#ff6b6b':'inherit'}">${S.fuel.toFixed(0)}%</span></div>
     <div class="chip"><small>${T.hudPhotos}</small>📷 ${S.photos}/69</div>`);
  if(alt<=0){
    setThrust(false);
    const z=TER.zone, inZone=S.x>=z.x0&&S.x<=z.x1;
    S.y=terH(S.x)+4;
    if(kmh<=SAFE_KMH && inZone){ S.state='won'; S.photos=69; chime(); setTimeout(()=>beep(1320,.3),220); setTimeout(()=>winCard(kmh),700); }
    else { S.state='crash'; S.crashKmh=kmh; beep(90,.5,'sawtooth',.12); track('crash');
      const why = kmh>SAFE_KMH ? T.crashFast(num(kmh,1)) : T.crashRocky(num(kmh,1));
      setTimeout(()=>showCard(T.crashCard(why),
        [{label:T.tryAgain,fn:startStage3Quick},{label:T.backToStart,ghost:true,fn:titleScreen}]),900);
    }
  }
}
function startStage3Quick(){ buildTerrain(); s3={x:70,y:START_ALT,vx:2.2,vy:-2.5,fuel:100,state:'fly',t:0,photos:0,lastPhoto:0,flash:0,thrust:false}; }
function winCard(kmh){
  $('pad').classList.remove('show'); track('landed');
  showCard(T.winCard(num(kmh,1)),
    [{label:T.playAgain,fn:titleScreen},{label:T.landAgain,ghost:true,fn:startStage3}]);
}
function drawStage3(t){
  const S=s3;
  bg(); drawStars(0,t);
  // big Eros limb in the sky
  const foot=isTouch?100:10, sc=Math.min(W/WORLD_W,(H-100-foot)/(START_ALT+70)), ox=(W-WORLD_W*sc)/2, gy=H-foot;
  const X=x=>ox+x*sc, Y=y=>gy-y*sc;
  // distant sun
  const sg=ctx.createRadialGradient(W*.88,H*.15,0,W*.88,H*.15,120); sg.addColorStop(0,'rgba(255,240,200,.9)'); sg.addColorStop(.15,'rgba(255,220,150,.35)'); sg.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  // ground
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,Y(TER.pts[0]));
  TER.pts.forEach((h,i)=>ctx.lineTo(X(i*2),Y(h))); ctx.lineTo(W,Y(TER.pts[TER.pts.length-1])); ctx.lineTo(W,H); ctx.closePath();
  const g=ctx.createLinearGradient(0,Y(50),0,H); g.addColorStop(0,'#c9a676'); g.addColorStop(1,'#4a3826');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,235,200,.6)'; ctx.lineWidth=2; ctx.beginPath(); TER.pts.forEach((h,i)=>i?ctx.lineTo(X(i*2),Y(h)):ctx.moveTo(X(0),Y(h))); ctx.stroke();
  // boulders
  for(const b of TER.boulders){ const bx=X(b.x), by=Y(terH(b.x)), r=b.r*sc;
    ctx.fillStyle='#8a6e4e'; ctx.beginPath(); ctx.ellipse(bx,by-r*.4,r,r*.8,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,235,200,.35)'; ctx.beginPath(); ctx.ellipse(bx-r*.3,by-r*.75,r*.4,r*.25,0,0,7); ctx.fill(); }
  // landing zone
  const z=TER.zone, zy=Y(22);
  ctx.fillStyle='rgba(93,242,154,.25)'; ctx.fillRect(X(z.x0),zy-4,(z.x1-z.x0)*sc,8);
  ctx.strokeStyle='#5df29a'; ctx.lineWidth=3; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.moveTo(X(z.x0),zy); ctx.lineTo(X(z.x1),zy); ctx.stroke(); ctx.setLineDash([]);
  for(const fx of [z.x0,z.x1]){ ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(fx),zy); ctx.lineTo(X(fx),zy-28); ctx.stroke(); ctx.fillStyle='#5df29a'; ctx.beginPath(); ctx.moveTo(X(fx),zy-28); ctx.lineTo(X(fx)+16,zy-22); ctx.lineTo(X(fx),zy-16); ctx.fill(); }
  label(X((z.x0+z.x1)/2), zy+26, T.zone);
  // guide line
  if(S.state==='fly'){ ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.setLineDash([3,6]); ctx.beginPath(); ctx.moveTo(X(S.x),Y(S.y)); ctx.lineTo(X(S.x),Y(terH(S.x))); ctx.stroke(); ctx.setLineDash([]); }
  // craft (rotated so panels face down-ish; flame downward)
  const cs=Math.max(22,9*sc);
  if(S.state==='crash'){ for(let i=0;i<8;i++){ drawRock(X(S.x)+(i-4)*cs*.4,Y(S.y)-Math.abs(Math.sin(i))*cs*.5,cs*.18,i,i,'#c58a1c'); } }
  else drawNEAR(X(S.x),Y(S.y)-cs*.4,cs,0,S.thrust?1:0,'down');
  // side puffs
  if(S.state==='fly'&&S.fuel>0){ ctx.fillStyle='rgba(255,255,255,.7)';
    if(keys.left){ctx.beginPath();ctx.arc(X(S.x)+cs*.7,Y(S.y)-cs*.4,cs*.15*(1+Math.random()),0,7);ctx.fill();}
    if(keys.right){ctx.beginPath();ctx.arc(X(S.x)-cs*.7,Y(S.y)-cs*.4,cs*.15*(1+Math.random()),0,7);ctx.fill();} }
  if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash*1.2})`;ctx.fillRect(0,0,W,H);}
  // speed gauge
  if(S.state==='fly'){
    const kmh=Math.hypot(S.vx,S.vy)*3.6, gx=W-56, gyy=H*.3, gh=H*.4, max=30;
    ctx.fillStyle='rgba(14,22,58,.85)'; ctx.fillRect(gx-6,gyy-6,30,gh+12);
    const sy=gyy+gh-gh*SAFE_KMH/max; ctx.fillStyle='rgba(93,242,154,.35)'; ctx.fillRect(gx,sy,18,gyy+gh-sy);
    const vy=gyy+gh-gh*clamp(kmh/max,0,1); ctx.fillStyle=kmh<=SAFE_KMH?'#5df29a':kmh<=15?'#ffc44d':'#ff6b6b'; ctx.fillRect(gx-4,vy-3,26,6);
    ctx.save(); ctx.translate(gx-16,gyy+gh/2); ctx.rotate(-Math.PI/2); ctx.font='700 13px "Baloo 2", Nunito, "M PLUS Rounded 1c"'; ctx.textAlign='center'; ctx.fillStyle='#a9b4dd'; ctx.fillText(T.gaugeSpeed,0,0); ctx.restore();
  }
}

// =====================================================================
// TITLE + LOOP
// =====================================================================
function titleScreen(){
  stage=0; clearMsgs(); hint(null); setThrust(false); $('hud').style.display='none'; $('pad').classList.remove('show'); $('landBtn').style.display='none';
  showCard(T.titleCard, [{label:T.startBtn,fn:startStage1}]); $('lang').classList.add('show');
  document.querySelectorAll('[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();audioInit();hideCard(); a.dataset.j==='2'?startStage2():startStage3();});
}
let titleT=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  if(stage===0){ titleT+=dt; bg(); drawStars(titleT*.01,t); const s=Math.min(W*.34,H*.6); drawEros(W*.5,H*.5,s,titleT*.05-.3,true); drawNEAR(W*.5+Math.cos(titleT*.4)*s*1.2,H*.5+Math.sin(titleT*.4)*s*.45,14,titleT*.4); }
  else if(stage===1){ if(!paused) updateStage1(dt); drawStage1(t); }
  else if(stage===2){ if(!paused) updateStage2(dt); drawStage2(t); }
  else if(stage===3){ if(!paused) updateStage3(dt); else setThrust(false); drawStage3(t); }
  requestAnimationFrame(frame);
}
titleScreen();
requestAnimationFrame(frame);
</script>
